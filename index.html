<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Opportunities HQ helps connect individuals with career and volunteer opportunities in Dubai and Vancouver.">
    <meta name="keywords" content="Opportunities, Career, Volunteer, Internships, Dubai, Vancouver">
    <meta name="author" content="Opportunities HQ">
    
    <title>Opportunities HQ</title>

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    
    <!-- Link to External CSS -->
    <link rel="stylesheet" href="styles.css">
    
    <!-- Favicon -->
    <link rel="icon" href="favicon.ico" type="image/x-icon">
</head>
<body>

    <!-- Header -->
    <header>
        <div class="container header-container">
            <h1>Opportunities HQ</h1>
            <nav>
                <ul>
                    <li><a href="#dubai">Dubai Opportunities</a></li>
                    <li><a href="#vancouver">Vancouver Opportunities</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="support.html">Support</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <!-- Main Content -->
    <main>
        <div class="container main-container">
            <aside>
                <h2>Filter Opportunities</h2>
                <form id="filter-form">
                    <div class="filter-group">
                        <label>Keywords/Tags:</label>
                        <div class="checkbox-group" id="keywords-checkboxes">
                            <label><input type="checkbox" name="keywords" value="Technology"> Technology</label>
                            <label><input type="checkbox" name="keywords" value="Education"> Education</label>
                            <label><input type="checkbox" name="keywords" value="Marketing"> Marketing</label>
                            <label><input type="checkbox" name="keywords" value="Business"> Business</label>
                            <label><input type="checkbox" name="keywords" value="Environment"> Environment</label>
                            <label><input type="checkbox" name="keywords" value="Research"> Research</label>
                            <label><input type="checkbox" name="keywords" value="Community"> Community</label>
                            <label><input type="checkbox" name="keywords" value="Events"> Events</label>
                        </div>
                    </div>
                    
                    <div class="filter-group">
                        <label>Payment Type:</label>
                        <label><input type="checkbox" name="payment" value="paid"> Paid</label>
                        <label><input type="checkbox" name="payment" value="voluntary"> Voluntary</label>
                    </div>

                    <div class="filter-group">
                        <label>Work Mode:</label>
                        <label><input type="checkbox" name="workMode" value="remote"> Remote</label>
                        <label><input type="checkbox" name="workMode" value="hybrid"> Hybrid</label>
                        <label><input type="checkbox" name="workMode" value="in-person"> In-Person</label>
                    </div>

                    <div class="filter-group">
                        <label for="target">Target Grade/Age:</label>
                        <select id="target" name="target">
                            <option value="">Any</option>
                            <option value="12th Grade">12th Grade</option>
                            <option value="11th Grade">11th Grade</option>
                            <option value="10th Grade">10th Grade</option>
                            <option value="9th Grade">9th Grade</option>
                            <option value="Any Grade">Any Grade</option>
                        </select>
                    </div>

                    <div class="filter-buttons">
                        <button type="button" id="apply-filters">Apply Filters</button>
                        <button type="button" id="reset-filters">Reset Filters</button>
                    </div>
                </form>
            </aside>

            <section id="opportunities">
                <section id="dubai">
                    <h2>Dubai-Based Opportunities</h2>
                    <div class="activities" id="dubai-activities">
                        
                    </div>
                </section>
                
                <section id="vancouver">
                    <h2>Vancouver-Based Opportunities</h2>
                    <div class="activities" id="vancouver-activities">
                
                    </div>
                </section>
                
            </section>
        </div>
    </main>

    <!-- Footer -->
    <footer>
        <div class="container footer-container">
            <p>&copy; 2024 Opportunities HQ. All rights reserved.</p>
            <div class="social">
                <a href="https://www.instagram.com/opportunities_hq/" class="social-link">
                    <img src="Instagram_icon.png" alt="Instagram" class="social-icon"> Instagram
                </a>
                |
                <a href="https://www.linkedin.com/company/opportunities-hq/?originalSubdomain=ca" class="social-link">
                    <img src="Linkedin_icon.png" alt="LinkedIn" class="social-icon"> LinkedIn
                </a>
            </div>
        </div>
    </footer>

    <!-- External JavaScript -->
    <script src="script.js"></script>

</body>
</html>
